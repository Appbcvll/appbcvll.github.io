<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Seguimiento de pacientes</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Seguimiento"><meta name="robots" content="noindex">
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#1d2733;--mu:#667585;--ac:#2b5d8a;--acx:#fff;--bd:#d3dae1;--dg:#a8322b;--on:#dce9f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#13181d;--card:#1c232a;--tx:#e6ebf0;--mu:#93a1af;--ac:#7fb2e0;--acx:#0d1620;--bd:#323d47;--dg:#f09a94;--on:#26425c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#13181d;--card:#1c232a;--tx:#e6ebf0;--mu:#93a1af;--ac:#7fb2e0;--acx:#0d1620;--bd:#323d47;--dg:#f09a94;--on:#26425c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:.2em 0 .5em}h1{font-size:1.9rem}h3{font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.mu,small{color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;min-width:0}
textarea{width:100%}input.n{width:76px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 16px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}button.d{color:var(--dg);border-color:var(--dg)}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts button{min-width:56px;min-height:52px;font-size:1.1rem}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);margin-top:4px}
.li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button.on{background:var(--on);color:var(--tx);border-color:var(--ac)}
.q{border-top:1px solid var(--bd);padding:14px 0}.msg{background:var(--on);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.big{font-size:1.3rem;padding:14px;width:100%;margin:10px 0;letter-spacing:.05em}.ctr{text-align:center}
svg text{fill:var(--mu);font-size:11px}svg .g{stroke:var(--bd)}svg .l{stroke:var(--ac);fill:none;stroke-width:2.5}svg circle{fill:var(--ac)}
details{margin:4px 0}summary{cursor:pointer}
button.sel{background:var(--on);border-color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.mod{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:420px;width:100%}
button.dd{background:var(--dg);color:var(--bg);border-color:var(--dg);font-weight:600}.tr{padding:8px 10px;line-height:0}
</style></head><body><div id="app"></div>
<script>
const K='psq_v1',TY={scale:'Escala numérica',yesno:'Sí / No',choice:'Opción múltiple',text:'Texto libre'};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
const sq=(t,o={})=>({id:uid(),t,type:'scale',min:0,max:3,lo:'Nunca',hi:'Casi todos los días',...o});
function seed(){
 const A=['Me he sentido nervioso/a o con los nervios de punta','No he podido parar o controlar mis preocupaciones','Me he preocupado demasiado por distintas cosas','Me ha costado relajarme','Me he sentido irritable o con miedo de que algo malo pudiera pasar'].map(t=>sq(t));
 const B=['Poco interés o placer en hacer las cosas','Me he sentido decaído/a, deprimido/a o sin esperanza','Dificultad para dormir o dormir demasiado','Me he sentido cansado/a o con poca energía','Me he sentido mal conmigo mismo/a'].map(t=>sq(t));
 const C=[sq('¿Cómo valora su estado de ánimo esta semana?',{max:10,lo:'Muy malo',hi:'Muy bueno'}),sq('¿Cómo ha dormido esta semana?',{max:10,lo:'Muy mal',hi:'Muy bien'}),{id:uid(),type:'text',t:'¿Quiere comentar algo en la consulta de hoy?'}];
 return{consent:CONS,forms:[{id:'f1',name:'Ansiedad (ejemplo)',qs:A},{id:'f2',name:'Estado de ánimo (ejemplo)',qs:B},{id:'f3',name:'Seguimiento general (ejemplo)',qs:C}],patients:{}}}
const E='psq_enc',CONS='Sus respuestas a estos cuestionarios se guardan cifradas en este dispositivo para el seguimiento de su proceso terapéutico. Son datos de salud y solo accederá a ellos su psicólogo/a. Puede solicitar el acceso, la rectificación o la supresión de sus datos en cualquier momento.\n\n[El profesional debe completar aquí: responsable del tratamiento, base jurídica, plazo de conservación y contacto.]';
let D=null,KEY=null,SALT=null,RAW=null,W=null,tmr;
const b64=u=>{let s='';new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const dk=async(pw,salt)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
async function enc(){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(D)));return JSON.stringify({v:2,d:{i:b64(iv),c:b64(c)},p:W.p,r:W.r,b:W.b})}
async function dec(sec,blob,how){const o=JSON.parse(blob);
 if(o.v==1){const k=await dk(sec,ub(o.s));const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},k,ub(o.c))));return{d,legacy:true}}
 const raw=await unwrap(sec,o[how||'p']),k=await aes(raw);const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.d.i)},k,ub(o.d.c))));return{d,raw,k,w:{p:o.p,r:o.r,b:o.b}}}
const save=async()=>{if(!KEY||!W)return;try{localStorage.setItem(E,await enc())}catch(e){}};
const aes=r=>crypto.subtle.importKey('raw',r,'AES-GCM',false,['encrypt','decrypt']);
async function wrap(sec,raw){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await dk(sec,s),raw);return{s:b64(s),i:b64(iv),c:b64(c)}}
async function unwrap(sec,w){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(w.i)},await dk(sec,ub(w.s)),ub(w.c)))}
const newCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(20));return[...r].map(x=>A[x%32]).join('').match(/.{4}/g).join('-')};
async function setup(v){RAW=crypto.getRandomValues(new Uint8Array(32));KEY=await aes(RAW);const c=newCode();W={p:await wrap(v,RAW),r:await wrap(norm(c),RAW)};S.rc=c;S.firstRc=true;await save()}
function rc(){return`<div class="card ctr" style="margin-top:6vh"><h2>Código de recuperación</h2><p>Guárdelo en un lugar seguro, fuera de la tablet. Es la única forma de restablecer la contraseña sin perder los datos. No se volverá a mostrar.</p><p style="font-size:1.4rem;font-family:ui-monospace,Menlo,monospace;user-select:all">${S.rc}</p><button class="p big" onclick="rcDone()">He guardado el código</button></div>`}
function rcDone(){const f=S.firstRc;S.rc=null;S.firstRc=null;S.v='pro';render();if(f)autoBackup()}
function resetV(){return`<div class="card ctr" style="margin-top:8vh"><h2>Restablecer contraseña</h2>${M()}<p class=mu>Introduzca su código de recuperación y una contraseña nueva. Los datos no se pierden.</p><input id=rcd class=big placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize=characters autocomplete=off><input id=np type=password class=big placeholder="Nueva contraseña (mín. 8)"><button class="p big" onclick="doReset()">Restablecer</button><button onclick="go('lock')">Volver</button></div>`}
async function doReset(){const c=norm($('#rcd').value),n=$('#np').value;if(n.length<8)return msg('La contraseña nueva debe tener al menos 8 caracteres.');
 try{const r=await dec(c,localStorage.getItem(E),'r');if(r.legacy)throw 0;D=r.d;RAW=r.raw;KEY=r.k;W={p:await wrap(n,RAW),r:r.w.r,b:r.w.b};await save()}catch(e){return msg('Código incorrecto o datos no compatibles.')}
 S.un=true;S.v='pro';bump();render();autoBackup()}
async function chgPw(){const n=$('#cp').value;if(n.length<8)return msg('Mínimo 8 caracteres.');W.p=await wrap(n,RAW);await save();msg('Contraseña cambiada.')}
async function newRc(){const c=newCode();W.r=await wrap(norm(c),RAW);await save();S.rc=c;S.v='rc';render()}
async function autoBackup(m){try{if(!KEY)return;const fn='seguimiento-'+new Date().toISOString().slice(0,10)+'.json',data=await enc();if(window.claude){const dl=await claude.use('downloads');if(!dl){if(m)msg('Este dispositivo no permite guardar archivos. Use «Generar copia cifrada» y copie el texto.');return}await dl.save({filename:fn,data})}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}S.bk=true;if(m)msg('Copia guardada.')}catch(e){if(m&&!(e&&e.code=='declined'))msg('No se pudo guardar la copia.')}}
async function loadF(i){const f=i.files[0];if(f)$('#tx').value=await f.text()}
const PRFS=new TextEncoder().encode('psq-bio-v1'),hasBio=()=>{try{return!!JSON.parse(localStorage.getItem(E)).b}catch(e){return false}};
async function bioEval(id){const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id}],userVerification:'required',extensions:{prf:{eval:{first:PRFS}}}}});const r=a.getClientExtensionResults().prf;if(!r||!r.results||!r.results.first)throw 0;return new Uint8Array(r.results.first)}
const bioErr=e=>{const n=(e&&e.name)||'';return n=='NotAllowedError'?(window.top===window?'Se canceló o no se autorizó la verificación.':'El navegador bloquea Face ID / Touch ID en esta página incrustada. Pruebe a abrir la página directamente en Safari.'):n=='SecurityError'?'El navegador no permite Face ID / Touch ID en esta página.':'Este iPad o navegador no admite el desbloqueo con Face ID / Touch ID en esta página.'};
async function bioOn(){try{if(!window.PublicKeyCredential||!KEY)throw new Error('np');
 const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Seguimiento'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'profesional',displayName:'Profesional'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},extensions:{prf:{eval:{first:PRFS}}}}});
 const ex=cr.getClientExtensionResults();if(!ex.prf)throw new Error('np');
 const id=new Uint8Array(cr.rawId),f=ex.prf.results&&ex.prf.results.first;if(!f&&!ex.prf.enabled)throw new Error('np');if(!f){S.pend=b64(id);return msg('Paso 2: pulse «Confirmar con Face ID / Touch ID».')}const out=new Uint8Array(f),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aes(out),RAW);W.b={id:b64(id),i:b64(iv),c:b64(c)};S.pend=null;await save();msg('Face ID / Touch ID activado.')}
 catch(e){msg(bioErr(e))}}
async function bioFin(){try{const id=ub(S.pend),out=await bioEval(id),iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aes(out),RAW);W.b={id:b64(id),i:b64(iv),c:b64(c)};S.pend=null;await save();msg('Face ID / Touch ID activado.')}catch(e){msg(bioErr(e))}}
async function bioOff(){delete W.b;await save();msg('Face ID / Touch ID desactivado.')}
const TR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>';
function askDel(d){S.del=d;dm()}
function cancelDel(){S.del=null;const o=document.querySelector('.ov');if(o)o.remove()}
function confirmDel(){if(S.del&&D.patients[S.del]){delete D.patients[S.del];save()}S.del=null;render()}
function dm(){if(!S.del||S.v!='pro'||S.tab!='pat')return;const d=S.del,p=D.patients[d];if(!p){S.del=null;return}
 $('#app').insertAdjacentHTML('beforeend',`<div class=ov onclick="if(event.target==this)cancelDel()"><div class=mod role=alertdialog aria-modal=true aria-labelledby=mt><h3 id=mt>¿Eliminar paciente?</h3><p>Se borrarán el paciente <b>${esc(d)}</b> y sus ${p.ss.length} registros. Esta acción no se puede deshacer.</p><div class=row style="justify-content:flex-end"><button onclick="cancelDel()">Cancelar</button><button class=dd onclick="confirmDel()">Eliminar</button></div></div></div>`);document.querySelector('.ov button').focus()}
function hl(){if(S.v!='pro'||S.tab!='dat')return;const on=[];if(W&&W.b)on.push('Activar Face ID / Touch ID');if(S.out=='json')on.push('Generar copia cifrada');if(S.out=='csv')on.push('Generar tabla (CSV)');if(S.bk)on.push('Guardar copia en archivo');document.querySelectorAll('#app .card button').forEach(b=>b.classList.toggle('sel',on.includes(b.textContent.trim())))}

async function bioUnlock(){try{const o=JSON.parse(localStorage.getItem(E));if(!o.b)throw 0;
 const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.b.i)},await aes(await bioEval(ub(o.b.id))),ub(o.b.c)));const first=!KEY;
 if(first){const k=await aes(raw);D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.d.i)},k,ub(o.d.c))));RAW=raw;KEY=k;W={p:o.p,r:o.r,b:o.b}}
 S.un=true;S.v='pro';bump();render();if(first)autoBackup()}
 catch(e){msg(bioErr(e)+' Use la contraseña.')}}
function info(){const r=D.rgpd||{},f=(v,t)=>esc(v||t);return`<p>Antes de responder, le informamos sobre el tratamiento de sus datos personales, conforme al Reglamento (UE) 2016/679 (RGPD) y a la Ley Orgánica 3/2018.</p><h3>Responsable</h3><p>${f(r.resp,'[Nombre y datos del profesional]')}. Contacto: ${f(r.cont,'[Correo o teléfono de contacto]')}.</p><h3>Qué datos se tratan y para qué</h3><p>Su número de paciente y sus respuestas a los cuestionarios, que son datos de salud. Se usan solo para el seguimiento clínico de su evolución.</p><h3>Base jurídica</h3><p>Su consentimiento explícito (art. 6.1.a y 9.2.a del RGPD). Puede retirarlo en cualquier momento sin que afecte a la atención que recibe.</p><h3>Conservación</h3><p>${f(r.plazo,'[Plazo de conservación]')}.</p><h3>Seguridad y destinatarios</h3><p>Los datos se guardan cifrados en este dispositivo y no se ceden a terceros salvo obligación legal.</p><h3>Sus derechos</h3><p>Puede solicitar el acceso, la rectificación, la supresión, la limitación, la oposición y la portabilidad de sus datos dirigiéndose al responsable. Si considera que no se han respetado, puede reclamar ante la Agencia Española de Protección de Datos (www.aepd.es).</p>`}
let S={v:'lock',tab:'pat',un:false,msg:'',arm:null};
const lockApp=()=>{D=null;KEY=null;SALT=null;RAW=null;W=null;S={v:'lock',tab:'pat',un:false,msg:'',arm:null};render()};
const bump=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{if(!KEY)return;if(S.v=='fill')return bump();lockApp()},600000)};
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>KEY&&bump()));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&KEY&&S.v!='fill')lockApp()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function lockV(){const has=!!localStorage.getItem(E);return`<div class="card ctr" style="margin-top:8vh"><h2>${has?'Desbloquear':'Crear contraseña'}</h2>${M()}<p class=mu>${has?'Introduzca su contraseña para abrir los datos.':'Cree una contraseña de al menos 8 caracteres. Cifra todos los datos. Después recibirá un código de recuperación: guárdelo, porque es la única forma de restablecer la contraseña.'}</p><input id=pin type=password class=big autocomplete=off onkeydown="if(event.key=='Enter')unlock()"><button class="p big" onclick="unlock()">${has?'Desbloquear':'Crear y empezar'}</button>${hasBio()?'<button class="big" onclick="bioUnlock()">Usar Face ID / Touch ID</button>':''}${has?"<button onclick=\"go('reset')\">Olvidé mi contraseña</button>":''}</div>`}
const go=v=>{S.v=v;S.msg='';render();scrollTo(0,0)};
const msg=t=>{S.msg=t;render();S.msg='';scrollTo(0,0)};
const sc=(qs,a)=>{let s=0,m=0;qs.forEach(q=>{if(q.type=='scale'){s+=(Number(a[q.id])||0)-q.min;m+=q.max-q.min}});return{s,m}};
const norm=v=>v.toUpperCase().replace(/[\s\-.]/g,'');
function okDni(v){const m=v.match(/^([XYZ]|\d)(\d{7})([A-Z])$/);if(!m)return false;const i='XYZ'.indexOf(m[1]);return'TRWAGMYFPDXBNJZSQVHLCKE'[+((i>=0?i:m[1])+m[2])%23]==m[3]}
const fopts=sel=>D.forms.map(f=>`<option value="${f.id}" ${f.id==sel?'selected':''}>${esc(f.name)}</option>`).join('');
const M=()=>S.msg?`<div class=msg>${esc(S.msg)}</div>`:'';
function render(){$('#app').innerHTML=({home,fill,done,pro,cons,rc,lock:lockV,reset:resetV})[S.v]();S.out=null;hl();dm()}

/* PACIENTE */
function home(){return`<div class="card ctr" style="margin-top:8vh"><h1>Gracias</h1><p class=mu>Devuelva la tablet al profesional.</p></div><p class=ctr><button onclick="S.un=false;go('pro')">Área profesional</button></p>`}

function cons(){return`<div class=card><h2>Consentimiento</h2>${M()}${info()}<label class=row><input type=checkbox id=ck style="width:24px;height:24px"> He leído la información y doy mi consentimiento explícito al tratamiento de mis datos de salud.</label></div><div class=row><button class=p onclick="accept()">Continuar</button><button onclick="go('home')">No acepto</button></div>`}
function accept(){if(!$('#ck').checked)return msg('Debe marcar la casilla para continuar.');D.patients[S.dni].cons=Date.now();save();go('fill')}
function fill(){const f=S.f;return`<h2>${esc(f.name)}</h2>${M()}${f.qs.map(q=>`<div class=card><b>${esc(q.t)}</b><div style="margin-top:10px">${qin(q)}</div></div>`).join('')}<button class="p big" onclick="submit()">Enviar respuestas</button>`}
function qin(q){const on=v=>String(S.ans[q.id])===String(v)?'on':'';const b=v=>`<button class="${on(v)}" data-q="${q.id}" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`;
 if(q.type=='scale'){let r=[];for(let i=q.min;i<=q.max;i++)r.push(b(i));return`<div class=opts>${r.join('')}</div><div class=ends><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`}
 if(q.type=='yesno')return`<div class=opts>${b('Sí')}${b('No')}</div>`;
 if(q.type=='choice')return`<div class=opts>${(q.o||'').split('\n').map(x=>x.trim()).filter(Boolean).map(b).join('')}</div>`;
 return`<textarea rows=3 oninput="S.ans['${q.id}']=this.value">${esc(S.ans[q.id]||'')}</textarea>`}
function pick(b){S.ans[b.dataset.q]=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function submit(){const f=S.f;if(f.qs.some(q=>q.type!='text'&&S.ans[q.id]===undefined))return msg('Responda todas las preguntas antes de enviar.');
 const r=sc(f.qs,S.ans);D.patients[S.dni].ss.push({ts:Date.now(),fid:f.id,fn:f.name,qs:f.qs.map(({id,t,type,min,max})=>({id,t,type,min,max})),a:S.ans,s:r.s,m:r.m});save();S.dni=null;go('done');setTimeout(()=>{if(S.v=='done')go('home')},4000)}
function done(){return`<div class="card ctr" style="margin-top:12vh"><h1>Gracias</h1><p>Sus respuestas se han guardado. Puede devolver la tablet al profesional.</p></div>`}

/* PROFESIONAL */
function pro(){if(!S.un)return`<div class="card ctr" style="margin-top:8vh"><h2>Área profesional</h2>${M()}<p class=mu>Introduzca su contraseña para acceder al área profesional.</p><input id=pin type=password class=big onkeydown="if(event.key=='Enter')unlock()"><button class="p big" onclick="unlock()">Entrar</button>${hasBio()?'<button class="big" onclick="bioUnlock()">Usar Face ID / Touch ID</button>':''}<button onclick="go('home')">Volver</button></div>`;
 const T=[['pat','Pacientes'],['frm','Formularios'],['dat','Datos']];
 return`<div class=tabs>${T.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.pv=null;S.ed=null;render()">${l}</button>`).join('')}<button onclick="lockApp()">Bloquear</button></div>${M()}${({pat:patV,frm:frmV,dat:datV})[S.tab]()}`}
async function unlock(){let first=false;const v=$('#pin').value,blob=localStorage.getItem(E);
 try{
  if(!blob){if(v.length<8)return msg('La contraseña debe tener al menos 8 caracteres.');
   D=seed();
   try{const old=JSON.parse(localStorage.getItem(K));if(old&&old.forms){D=old;delete D.pin}}catch(e){}
   first=true;await setup(v);localStorage.removeItem(K)}
  else{const r=await dec(v,blob);if(!KEY){first=true;D=r.d;if(r.legacy)await setup(v);else{RAW=r.raw;KEY=r.k;W=r.w}}}
 }catch(e){return msg('Contraseña incorrecta.')}
 S.un=true;S.v=S.rc?'rc':'pro';bump();render();if(first&&!S.rc)autoBackup()}
function arm(k,fn){if(S.arm!==k){S.arm=k;return render()}S.arm=null;fn();save();render()}
const ab=(k,l)=>S.arm===k?'¿Seguro? Pulse otra vez':l;

function patV(){if(S.pv)return detV();const P=Object.entries(D.patients);
 return`<div class=card><h3>Nuevo cuestionario</h3><p class=mu>Introduzca el número de paciente, elija el formulario y entregue la tablet al paciente. No use el nombre ni el DNI.</p><div class=row><input id=nd placeholder="Número de paciente" autocomplete=off><select id=nf>${fopts()}</select><button class=p onclick="startQ($('#nd').value,$('#nf').value)">Iniciar cuestionario</button></div></div>
<div class=card><h3>Pacientes (${P.length})</h3>${P.map(([d,p])=>`<div class=li><div class=row style="flex-wrap:nowrap"><button class="d tr" aria-label="Eliminar paciente ${d}" title="Eliminar paciente" onclick="askDel('${d}')">${TR}</button><div><b>${esc(d)}</b> ${esc(p.alias)}<br><small>${p.ss.length} registros${p.ss.length?' · último '+fd(p.ss[p.ss.length-1].ts):''}</small></div></div><div class=row><select onchange="D.patients['${d}'].fid=this.value;save()">${fopts(p.fid)}</select><button class=p onclick="startQ('${d}',D.patients['${d}'].fid)">Iniciar</button><button onclick="S.pv='${d}';render()">Ver evolución</button></div></div>`).join('')||'<p class=mu>Aún no hay pacientes. Se crean al iniciar su primer cuestionario.</p>'}</div>`}
function startQ(num,fid){num=String(num||'').trim().toUpperCase();const f=D.forms.find(x=>x.id==fid);
 if(!/^[\w.\-]{1,30}$/.test(num))return msg('El número de paciente solo puede llevar letras, números, punto y guion (máx. 30).');
 if(!f)return msg('Seleccione un formulario.');
 const p=D.patients[num]||(D.patients[num]={alias:'',fid:f.id,ss:[]});p.fid=f.id;save();S.dni=num;S.f=f;S.ans={};S.un=false;go(p.cons?'fill':'cons')}
function renP(d){const n=$('#rn').value.trim().toUpperCase();if(!/^[\w.\-]{1,30}$/.test(n))return msg('Número no válido.');if(D.patients[n])return msg('Ese número ya existe.');D.patients[n]=D.patients[d];delete D.patients[d];S.pv=n;save();render()}
function chart(ss){ss=ss.filter(x=>x.m>0);if(!ss.length)return'';const W=600,H=210,p=36,n=ss.length;
 const P=ss.map((x,i)=>({x:n<2?W/2:p+i*(W-2*p)/(n-1),v:Math.round(100*x.s/x.m)})).map((o,i)=>({...o,y:H-p-o.v/100*(H-2*p),d:new Date(ss[i].ts).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}));
 return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px" role="img" aria-label="Evolución de la puntuación">${[0,50,100].map(v=>{const y=H-p-v/100*(H-2*p);return`<line class=g x1=${p} x2=${W-p} y1=${y} y2=${y}></line><text x=4 y=${y+4}>${v}%</text>`}).join('')}<polyline class=l points="${P.map(o=>o.x+','+o.y).join(' ')}"></polyline>${P.map(o=>`<circle cx=${o.x} cy=${o.y} r=4></circle><text x=${o.x} y=${o.y-9} text-anchor=middle>${o.v}%</text><text x=${o.x} y=${H-12} text-anchor=middle>${o.d}</text>`).join('')}</svg></div><small>Puntuación de las escalas numéricas, en porcentaje del máximo posible.</small>`}
function detV(){const d=S.pv,p=D.patients[d];if(!p){S.pv=null;return patV()}
 return`<p><button onclick="S.pv=null;render()">Volver</button></p><div class=card><h3>${esc(d)} ${esc(p.alias)}</h3><p><small>Consentimiento: ${p.cons?fd(p.cons):'pendiente'}</small></p><div class=row><input id=rn placeholder="Nuevo número de paciente"><button onclick="renP('${d}')">Cambiar número</button></div>${p.ss.length?chart(p.ss):'<p class=mu>Todavía no hay registros.</p>'}</div>
<div class=card><h3>Registros</h3>${p.ss.slice().reverse().map((s,j)=>{const i=p.ss.length-1-j;return`<div class=li style="display:block"><div class=row style="justify-content:space-between"><span><b>${fd(s.ts)}</b> · ${esc(s.fn)}${s.m?` · ${s.s}/${s.m}`:''}</span><button class=d onclick="arm('s${d}${i}',()=>D.patients['${d}'].ss.splice(${i},1))">${ab('s'+d+i,'Eliminar')}</button></div><details><summary>Ver respuestas</summary>${s.qs.map(q=>`<p><small>${esc(q.t)}</small><br>${esc(s.a[q.id]??'—')}</p>`).join('')}</details></div>`}).join('')||'<p class=mu>Sin registros.</p>'}</div>
<button class=d onclick="arm('p${d}',()=>{delete D.patients['${d}'];S.pv=null})">${ab('p'+d,'Eliminar paciente y todos sus registros')}</button><div class=card style="margin-top:16px"><h3>Derechos del paciente</h3><p class=mu>Acceso y portabilidad: genere sus datos en texto. Supresión: use el botón rojo de arriba.</p><button onclick="$('#ex').value=JSON.stringify(D.patients['${d}'],null,1)">Generar datos del paciente</button><textarea id=ex rows=6 style="margin-top:8px"></textarea></div>`}

function frmV(){if(S.ed)return edV();
 return`<div class=card><div class=row style="justify-content:space-between"><h3>Formularios</h3><button class=p onclick="S.ed={id:uid(),name:'',qs:[sq('')]};render()">Nuevo formulario</button></div>${D.forms.map(f=>`<div class=li><div><b>${esc(f.name)}</b><br><small>${f.qs.length} preguntas</small></div><div class=row><button onclick="S.ed=JSON.parse(JSON.stringify(D.forms.find(x=>x.id=='${f.id}')));render()">Editar</button><button onclick="dup('${f.id}')">Duplicar</button><button class=d onclick="arm('f${f.id}',()=>{D.forms=D.forms.filter(x=>x.id!='${f.id}')})">${ab('f'+f.id,'Eliminar')}</button></div></div>`).join('')||'<p class=mu>Cree su primer formulario.</p>'}</div>`}
function dup(id){const f=JSON.parse(JSON.stringify(D.forms.find(x=>x.id==id)));f.id=uid();f.name+=' (copia)';f.qs.forEach(q=>q.id=uid());D.forms.push(f);save();render()}
function edV(){const f=S.ed;
 return`<div class=card><h3>Formulario</h3><input style="width:100%" placeholder="Nombre (por ejemplo, Trastorno de ansiedad)" value="${esc(f.name)}" oninput="S.ed.name=this.value">
${f.qs.map((q,i)=>`<div class=q><textarea rows=2 placeholder="Texto de la pregunta" oninput="S.ed.qs[${i}].t=this.value">${esc(q.t)}</textarea><div class=row style="margin-top:8px"><select onchange="S.ed.qs[${i}].type=this.value;render()">${Object.entries(TY).map(([k,v])=>`<option value=${k} ${q.type==k?'selected':''}>${v}</option>`).join('')}</select>
${q.type=='scale'?`<span>de</span><input type=number class=n value="${q.min}" oninput="S.ed.qs[${i}].min=+this.value"><span>a</span><input type=number class=n value="${q.max}" oninput="S.ed.qs[${i}].max=+this.value"><input placeholder="Etiqueta del mínimo" value="${esc(q.lo)}" oninput="S.ed.qs[${i}].lo=this.value"><input placeholder="Etiqueta del máximo" value="${esc(q.hi)}" oninput="S.ed.qs[${i}].hi=this.value">`:''}
<span style="margin-left:auto" class=row><button onclick="mv(${i},-1)" aria-label="Subir">↑</button><button onclick="mv(${i},1)" aria-label="Bajar">↓</button><button class=d onclick="S.ed.qs.splice(${i},1);render()">Quitar</button></span></div>
${q.type=='choice'?`<textarea rows=3 style="margin-top:8px" placeholder="Una opción por línea" oninput="S.ed.qs[${i}].o=this.value">${esc(q.o||'')}</textarea>`:''}</div>`).join('')}
<div class=row style="margin-top:12px"><button onclick="S.ed.qs.push(sq(''));render()">Añadir pregunta</button><button class=p onclick="saveF()">Guardar formulario</button><button onclick="S.ed=null;render()">Cancelar</button></div></div>`}
function mv(i,d){const a=S.ed.qs,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function saveF(){const f=S.ed;f.qs=f.qs.filter(q=>q.t.trim());if(!f.name.trim())return msg('Ponga un nombre al formulario.');if(!f.qs.length)return msg('Añada al menos una pregunta.');
 if(f.qs.some(q=>q.type=='scale'&&!(q.max>q.min)))return msg('En las escalas, el máximo debe ser mayor que el mínimo.');
 if(f.qs.some(q=>q.type=='choice'&&!(q.o||'').trim()))return msg('Las preguntas de opción múltiple necesitan opciones.');
 const i=D.forms.findIndex(x=>x.id==f.id);i<0?D.forms.push(f):D.forms[i]=f;save();S.ed=null;render()}

function datV(){return`<div class=card><h3>Copia de seguridad y exportación</h3><p class=mu>Los datos están cifrados en esta tablet. La copia cifrada solo se abre con la contraseña que tenía al generarla. La tabla CSV va sin cifrar: no la guarde ni la envíe sin protegerla.</p><div class=row><button onclick="$('#tx').value=localStorage.getItem(E)||'';S.out='json';hl()">Generar copia cifrada</button><button onclick="csv()">Generar tabla (CSV)</button><button onclick="$('#tx').select();document.execCommand('copy')">Copiar texto</button></div><textarea id=tx rows=8 style="margin:10px 0" placeholder="Aquí aparecerá la copia. Para restaurar, pegue aquí una copia cifrada."></textarea><input type=file accept=".json,.txt" onchange="loadF(this)" style="margin-bottom:8px"><div class=row><input id=rp type=password placeholder="Contraseña de esa copia"><button class=d onclick="restore()">Restaurar copia cifrada</button></div></div><div class=card><h3>Seguridad</h3><div class=row><input id=cp type=password placeholder="Nueva contraseña"><button onclick="chgPw()">Cambiar contraseña</button></div><div class=row style="margin-top:8px"><button onclick="newRc()">Generar nuevo código de recuperación</button><button onclick="bioOn()">Activar Face ID / Touch ID</button>${S.pend?'<button class="p" onclick="bioFin()">Confirmar con Face ID / Touch ID</button>':''}<button onclick="bioOff()">Desactivar Face ID / Touch ID</button><button onclick="autoBackup(true)">Guardar copia en archivo</button></div></div><div class=card><h3>Información RGPD para el paciente</h3><p class=mu>Se muestra antes del cuestionario. Complete estos datos y revise el texto con un especialista en protección de datos.</p><input style="width:100%;margin-bottom:8px" placeholder="Responsable del tratamiento" value="${esc((D.rgpd||{}).resp)}" oninput="(D.rgpd=D.rgpd||{}).resp=this.value"><input style="width:100%;margin-bottom:8px" placeholder="Contacto (correo o teléfono)" value="${esc((D.rgpd||{}).cont)}" oninput="(D.rgpd=D.rgpd||{}).cont=this.value"><input style="width:100%;margin-bottom:8px" placeholder="Plazo de conservación" value="${esc((D.rgpd||{}).plazo)}" oninput="(D.rgpd=D.rgpd||{}).plazo=this.value"><button onclick="save();msg('Datos guardados.')">Guardar</button></div>`}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';let r=['paciente,nota,fecha,formulario,puntuacion,maximo,respuestas'];
 Object.entries(D.patients).forEach(([d,p])=>p.ss.forEach(s=>r.push([d,q(p.alias),fd(s.ts),q(s.fn),s.s,s.m,q(s.qs.map(x=>x.t+': '+(s.a[x.id]??'')).join(' | '))].join(','))));$('#tx').value=r.join('\n');S.out='csv';hl()}
async function restore(){try{const r=await dec($('#rp').value,$('#tx').value.trim());if(!r.d.forms||!r.d.patients)throw 0;D=r.d;await save();msg('Copia restaurada.')}catch(e){msg('Copia no válida o contraseña incorrecta.')}}
render();
</script></body></html>
